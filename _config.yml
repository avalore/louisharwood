# Site settings
title: Louis Harwood
description: "Software engineer — macOS, iOS, fullstack, AWS, CI/CD. Building tools and shipping products."
author: Louis Harwood
url: "https://louisharwood.com"
baseurl: ""
timezone: "Europe/London"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/
paginate: 10
paginate_path: "/blog/page:num/"

kramdown:
  input: GFM

# Navigation
navigation:
  - title: About
    url: /about/
  - title: Projects
    url: /projects/
  - title: Blog
    url: /blog/
  - title: Air Sports
    url: /air-sports/

# Social links
social:
  twitter: louisharwood
  email: me@louisharwood.com
  linkedin: louisharwood
  instagram: avalore

# Profile
avatar: /assets/img/me.jpg

# SEO
keywords: "macOS developer, iOS developer, fullstack, PHP, Python, Angular, Next.js, AWS, CI/CD, freelance developer"

# RSS
rss-description: "Louis Harwood — software engineer, builder, shipper."

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "page"

# Exclude
exclude:
  - CHANGELOG.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - screenshot.png
  - beautiful-jekyll-theme.gemspec
  - Appraisals
  - staticman.yml
  - docs/

plugins:
  - jekyll-paginate
  - jekyll-sitemap
