<footer class="site-footer">
  <div class="footer-content">
    <div class="footer-social">
      {% if site.social.twitter %}
        <a href="https://twitter.com/{{ site.social.twitter }}" rel="noopener" target="_blank">Twitter</a>
      {% endif %}
      {% if site.social.linkedin %}
        <a href="https://linkedin.com/in/{{ site.social.linkedin }}" rel="noopener" target="_blank">LinkedIn</a>
      {% endif %}
      {% if site.social.instagram %}
        <a href="https://instagram.com/{{ site.social.instagram }}" rel="noopener" target="_blank">Instagram</a>
      {% endif %}
      {% if site.social.email %}
        <a href="mailto:{{ site.social.email }}">Email</a>
      {% endif %}
    </div>
    <p class="footer-copy">&copy; {{ site.time | date: '%Y' }} {{ site.author }}</p>
  </div>
</footer>
